# The version is 1.9.<number of commits>, computed from git by src/stb/_version.py.
# This recipe builds from a copy of stb-suite/ that has no git history, so export
# STB_VERSION (for example STB_VERSION=1.9.$(git rev-list --count HEAD)) before
# building; without it the package is version 1.9.0.
{% set version = environ.get("STB_VERSION", "1.9.0") %}

package:
  name: stb_suite
  version: "{{ version }}"

source:
  path: .

build:
  noarch: python
  script_env:
    - STB_VERSION
  script:
    - python -m pip install .   # Instala o pacote

channels:
  - conda-forge

requirements:
  host:
    - python>=3.9,<=3.12
    - pip
    - build
  run:
    - python>=3.9,<=3.12
    - numpy
    - matplotlib
    - pip
  pip:
    - ase
    - pymatgen
    - spglib>=2.2.0
    - sisl
    - pybader
    - phonopy
    - setuptools
    - scipy==1.13.1
    - pandas
    - icet

about:
  home: "https://github.com/bastoscmo"
  license: MIT
  summary: "Siesta ToolBox suite with softwares to pre and pos-processing data for Siesta code."
