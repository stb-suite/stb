[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stb_suite"
version = "1.9.1"
description = "Siesta ToolBox (STB) suite with softwares pre and pos processing for Siesta code."
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "numpy",
    "ase",
    "matplotlib",
    "pymatgen",
    "spglib>=2.2.0",  # >=2.1.0 for get_layergroup(), >=2.2.0 for its Hall-number fixes (stb-symmetry)
    "sisl",
    "pybader",
    "setuptools",
    "scipy",
    "phonopy",
    "pandas",
    "icet",
    "pyxtal"
]

[project.optional-dependencies]
# Heavy (PyTorch-based) stack for stb-mlrelax's ML pre-relaxation, kept out
# of the core dependencies so installing the suite doesn't force a PyTorch
# install. Install with: pip install stb_suite[ml]
ml = [
    "torch",
    "mace-torch"
]

