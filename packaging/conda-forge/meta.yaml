{% set name = "stb-suite" %}
{% set version = "2.1.0" %}
{% set python_min = "3.10" %}

# conda-forge recipe of STB-SUITE, for a pull request to github.com/conda-forge/staged-recipes
# (copy this file to recipes/stb-suite/meta.yaml there). Built from the sdist on PyPI, so the
# PyPI release comes first; then fill in the sha256 of that file:
#   curl -sL https://pypi.org/packages/source/s/stb_suite/stb_suite-2.1.0.tar.gz | sha256sum
# The optional 'ml' extra (torch, mace-torch, torch-dftd) is not a conda dependency: mace-torch is
# not on conda-forge; install it with pip on top when the ML tools are needed.

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/stb_suite/stb_suite-{{ version }}.tar.gz
  sha256: FILL_IN_AFTER_THE_PYPI_UPLOAD

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # one per console command of pyproject.toml ([project.scripts]); keep the two lists in step
  entry_points:
    - stb-bands = stb.bands:main
    - stb-fatbands = stb.fatbands:main
    - stb-convdos = stb.convdos:main
    - stb-structural = stb.structural:main
    - stb-translate = stb.translate:main
    - stb-strain = stb.strain:main
    - stb-suite = stb.stb_suite:main
    - stb-clean = stb.clean:main
    - stb-symmetry = stb.symmetry:main
    - stb-siesta2wtb = stb.wantibexos:main
    - stb-dos = stb.dos:main
    - stb-inputfile = stb.inputfile:main
    - stb-pseudo = stb.pseudo:main
    - stb-kgrid = stb.kgrid:main
    - stb-kpath = stb.kpath:main
    - stb-supercell = stb.supercell:main
    - stb-slab = stb.slab:main
    - stb-nanotube = stb.nanotube:main
    - stb-defect = stb.defect:main
    - stb-sqs = stb.sqs:main
    - stb-unitcell = stb.unitcell:main
    - stb-crystalbuilder = stb.crystalbuilder:main
    - stb-fetch = stb.fetch:main
    - stb-passivate = stb.passivate:main
    - stb-molecule = stb.molecule:main
    - stb-mlrelax = stb.mlrelax:main
    - stb-amorphize = stb.amorphize:main
    - stb-convergence = stb.convergence:main
    - stb-convergenceAnalysis = stb.convergence_analysis:main
    - stb-strainAnalysis = stb.strain_analysis:main
    - stb-elasticInputs = stb.elastic_inputs:main
    - stb-elasticAnalysis = stb.elastic_analysis:main
    - stb-bader = stb.bader:main
    - stb-cube = stb.cube:main
    - stb-ani2traj = stb.ani2traj:main
    - stb-status = stb.status:main
    - stb-archive = stb.archive:main
    - stb-nativecharges = stb.nativecharges:main
    - stb-density = stb.density:main
    - stb-stm = stb.stm:main
    - stb-wfdensity = stb.wfdensity:main
    - stb-sts = stb.sts:main
    - stb-coop = stb.coop:main
    - stb-ipr = stb.ipr:main
    - stb-effmass = stb.effmass:main
    - stb-spintexture = stb.spintexture:main
    - stb-workfunction = stb.workfunction:main
    - stb-2Dstacking = stb.stacking2D:main
    - stb-cohesive = stb.cohesive_energy:main
    - stb-cohesiveAnalysis = stb.cohesive_analysis:main
    - stb-adsorb = stb.adsorb:main
    - stb-adsorbBsse = stb.adsorb_bsse:main
    - stb-adsorbAnalysis = stb.adsorb_analysis:main
    - stb-adsorbGibbs = stb.adsorb_gibbs:main
    - stb-neb = stb.neb:main
    - stb-nebCycle = stb.neb_cycle:main
    - stb-nebAnalysis = stb.neb_analysis:main
    - stb-stackingfault = stb.stackingfault:main
    - stb-stackingfaultAnalysis = stb.stackingfault_analysis:main
    - stb-phononsCreate = stb.phonons_create:main
    - stb-phononsPos = stb.phonons_pos:main
    - stb-crystalcast = stb.crystalcast:main
    - stb-xrd = stb.xrd:main
    - stb-xrdsearch = stb.xrdsearch:main
    - stb-xrdrank = stb.xrdrank:main
    - stb-hubbardu = stb.hubbardu:main
    - stb-hubbarduAlphas = stb.hubbardu_alphas:main
    - stb-hubbarduAnalysis = stb.hubbardu_analysis:main
    - stb-dftu = stb.dftu:main
    - stb-raman = stb.raman:main
    - stb-ramanModes = stb.raman_modes:main
    - stb-ramanAnalysis = stb.raman_analysis:main
    - stb-ir = stb.ir:main
    - stb-irModes = stb.ir_modes:main
    - stb-irAnalysis = stb.ir_analysis:main
    - stb-gqca = stb.gqca:main
    - stb-gqcaAnalysis = stb.gqca_analysis:main
    - stb-optical = stb.optical:main
    - stb-opticalAnalysis = stb.optical_analysis:main
    - stb-aimdAnalysis = stb.aimd_analysis:main
    - stb-mlff = stb.mlff:main
    - stb-mlffAnalysis = stb.mlff_analysis:main
    - stb-mlffValidate = stb.mlff_validate:main
    - stb-mlffActiveLearning = stb.mlff_active_learning:main
    - stb-mlmd = stb.mlmd:main
    - stb-mlphonons = stb.mlphonons:main
    - stb-mlelastic = stb.mlelastic:main
    - stb-mlneb = stb.mlneb:main
    - stb-mladsorb = stb.mladsorb:main
    - stb-eosInputs = stb.eos_inputs:main
    - stb-eosAnalysis = stb.eos_analysis:main
    - stb-chargediffPrep = stb.chargediff_prep:main
    - stb-chargediffAnalysis = stb.chargediff_analysis:main
    - stb-hirshfeldPrep = stb.hirshfeld_prep:main
    - stb-hirshfeldIons = stb.hirshfeld_ions:main
    - stb-hirshfeldAnalysis = stb.hirshfeld_analysis:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >={{ python_min }},<3.13
    - numpy
    - ase
    - matplotlib-base
    - pymatgen
    - spglib >=2.2.0
    - sisl
    - pybader
    - setuptools
    - scipy
    - phonopy
    - pandas
    - icet
    - pyxtal

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - stb
    - stb.core.pseudopotentials
    - stb.core.structure_io
  commands:
    - pip check
    - stb-suite --version
    - stb-kgrid --help
    - stb-pseudo --list-banks --no-intro

about:
  home: https://stb-suite.github.io/stb/
  summary: "Command-line tools for every stage of a SIESTA DFT project: inputs, structures, post-processing and property workflows."
  description: |
    STB-SUITE (Siesta Toolbox Suite) is a collection of command-line tools that assist users of the
    SIESTA DFT code through every step of a project: generating inputs, building and converting
    structures, post-processing results, and running complete prepare-and-analyze workflows for a
    property (elastic constants, phonons, adsorption, NEB, optical properties, ...). It bundles
    PseudoDojo pseudopotential tables; SIESTA itself is installed separately.
  license: MIT
  license_file: LICENSE
  doc_url: https://stb-suite.github.io/stb/
  dev_url: https://github.com/stb-suite/stb

extra:
  recipe-maintainers:
    # GitHub accounts that will maintain the conda-forge feedstock (they are asked to confirm in the PR)
    - FILL_IN_GITHUB_USERNAME
